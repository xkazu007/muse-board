<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)">
<script>
  // Theme before first paint (no flash): "light" / "dark" pinned by the
  // toggle, nothing = follow the device.
  try {
    var t = localStorage.getItem("muse-board-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<title>Muse Board</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <span class="brand">Muse Board</span>
    <span class="top-right">
      <span id="date" class="muted"></span>
      <button id="theme-toggle" class="theme-toggle" data-mode="auto" aria-label="Theme: auto">
        <svg class="i-auto" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg>
        <svg class="i-light" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        <svg class="i-dark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </span>
  </header>

  <section id="token-box" class="card hidden">
    <h2>Sign in</h2>
    <p class="muted">Paste your board token once. It stays on this device.</p>
    <label class="sr-only" for="token-input">Board token</label>
    <input id="token-input" type="password" placeholder="Board token" autocomplete="off">
    <button id="token-save" class="btn primary wide">Save</button>
    <p id="token-error" class="error hidden">That token didn't work. Try again.</p>
  </section>

  <section id="board" class="hidden">
    <article class="card focus">
      <div class="focus-main">
        <p id="focus-meta" class="meta">Now</p>
        <h1 id="focus-step">…</h1>
        <p id="focus-task" class="muted"></p>
        <a id="focus-open" class="open-link hidden" target="_blank" rel="noopener noreferrer">Open link ↗</a>
        <details id="focus-more" class="more hidden">
          <summary>More</summary>
          <div id="focus-blocks" class="blocks"></div>
        </details>
      </div>
      <div class="focus-actions">
        <button id="btn-done" class="done" aria-label="Done">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </button>
        <button id="btn-later" class="later" aria-expanded="false" aria-controls="later-menu">Later</button>
      </div>
      <div id="later-menu" class="later-menu hidden" role="group" aria-label="Remind me">
        <p class="muted small">Come back to it…</p>
        <div id="later-options" class="chips"></div>
        <button id="later-cancel" class="link">Cancel</button>
      </div>
    </article>

    <section class="card inset">
      <p class="label">Then</p>
      <ul id="upcoming"></ul>
    </section>

    <p class="footer"><span id="done-count">0 done today</span> · <button id="btn-refresh" class="link">Refresh</button> · <button id="btn-logout" class="link">Change token</button></p>
  </section>

  <p id="status" class="muted small" role="status"></p>
</main>
<script src="/app.js"></script>
</body>
</html>
