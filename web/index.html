<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)">
<script>
  // Theme before first paint (no flash): "light" / "dark" pinned by the
  // toggle, nothing = follow the device.
  try {
    var t = localStorage.getItem("muse-board-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<title>Muse Board</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preload" href="/fonts/jakarta-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="app">
  <!-- Header like the phone's own apps: big title, actions on its row -->
  <header class="appbar">
    <h1 class="title">Today</h1>
    <button id="btn-menu" class="icon-btn" aria-label="More options" aria-haspopup="dialog">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="18.5" r="1.8" fill="currentColor"/></svg>
    </button>
  </header>
  <p id="date" class="subtitle"></p>

  <section id="token-box" class="card hidden">
    <h2>Sign in</h2>
    <p class="muted">Paste your board token once. It stays on this device.</p>
    <label class="sr-only" for="token-input">Board token</label>
    <input id="token-input" type="password" placeholder="Board token" autocomplete="off">
    <button id="token-save" class="btn primary wide">Save</button>
    <p id="token-error" class="error hidden">That token didn't work. Try again.</p>
  </section>

  <section id="board" class="hidden">
    <article class="card focus">
      <div class="focus-main">
        <div class="meta-row">
          <span id="focus-due" class="chip hidden"></span>
          <span id="focus-meta" class="meta"></span>
        </div>
        <h2 id="focus-step" class="step">…</h2>
        <p id="focus-task" class="muted"></p>
        <a id="focus-open" class="pill hidden" target="_blank" rel="noopener noreferrer">Open link ↗</a>
        <details id="focus-more" class="more hidden">
          <summary>More</summary>
          <div id="focus-blocks" class="blocks"></div>
        </details>
      </div>
      <div class="focus-actions">
        <button id="btn-done" class="done" aria-label="Done">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </button>
        <button id="btn-later" class="pill" aria-haspopup="dialog">Later</button>
      </div>
      <!-- Bottom row: checklist progress, estimate in the corner -->
      <div id="focus-bottom" class="focus-bottom hidden">
        <span id="focus-progress" class="muted"></span>
        <span id="focus-est" class="chip hidden"></span>
      </div>
    </article>

    <!-- Muse's suggestion: one at a time, the owner decides -->
    <article id="suggestion" class="card suggestion hidden">
      <div class="suggestion-head">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--accent)" d="M12 2.5C12.6 8 16 11.4 21.5 12 16 12.6 12.6 16 12 21.5 11.4 16 8 12.6 2.5 12 8 11.4 11.4 8 12 2.5Z"/></svg>
        <h3 id="suggestion-title"></h3>
      </div>
      <p id="suggestion-detail" class="muted"></p>
      <div id="suggestion-lines" class="suggestion-lines"></div>
      <div class="suggestion-actions">
        <button id="suggestion-dismiss" class="text-btn">Not now</button>
        <button id="suggestion-apply" class="pill">Apply</button>
      </div>
    </article>

    <h2 id="then-title" class="section-title">Then</h2>
    <div id="upcoming"></div>
  </section>
</main>

<!-- Bottom sheet: Later's choices and the ⋮ menu -->
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-panel">
    <div class="sheet-handle" aria-hidden="true"></div>
    <p id="sheet-title" class="sheet-title"></p>
    <p id="sheet-sub" class="sheet-sub muted"></p>
    <div id="sheet-rows"></div>
  </div>
</div>

<!-- Snackbar: "Done. Undo", "Moved…", errors -->
<div id="toast" class="toast hidden" role="status" aria-live="polite">
  <span id="toast-text"></span>
  <button id="toast-action" class="toast-action hidden"></button>
</div>
<script src="/app.js"></script>
</body>
</html>
